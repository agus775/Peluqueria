<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reservar turno | BarberShop</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/reservar_barber.css') }}">

</head>


<body>

    <!-- =========================================
         CONTENEDOR PRINCIPAL
    ========================================== -->

    <div class="contenedor">


        <!-- =====================================
             TÍTULO
        ====================================== -->

        <div class="titulo">

            <div class="titulo-linea">
                <span></span>
                <b>✂</b>
                <span></span>
            </div>

            <h1>Reservar turno</h1>

            <p>
                Completá tus datos para reservar.
            </p>

        </div>


        <!-- =====================================
             FORMULARIO
        ====================================== -->

        <form action="{{ url_for('nuevo') }}" method="POST">


            <!-- =================================
                 DATOS PERSONALES
            ================================== -->

            <div class="personal">

                <div class="encabezado-card">

                    <span class="icono">♙</span>

                    <div>
                        <h2>Datos personales</h2>
                        <p>Información del cliente</p>
                    </div>

                </div>


                <div class="datos">

                    <label for="nombre">
                        Nombre
                    </label>

                    <input type="text" id="nombre" name="nombre" placeholder="Ingresá tu nombre" required>

                </div>


                <div class="datos">

                    <label for="apellido">
                        Apellido
                    </label>

                    <input type="text" id="apellido" name="apellido" placeholder="Ingresá tu apellido" required>

                </div>


                <div class="datos">

                    <label for="dni">
                        DNI
                    </label>

                    <input type="text" id="dni" name="dni" placeholder="Ingresá tu DNI" required>

                </div>


                <div class="datos">

                    <label for="telefono">
                        Teléfono
                    </label>

                    <input type="text" id="telefono" name="telefono" placeholder="Ingresá tu teléfono" required>

                </div>

            </div>



            <!-- =================================
                 DATOS DEL TURNO
            ================================== -->

            <div class="barber">

                <div class="encabezado-card">

                    <span class="icono">▣</span>

                    <div>
                        <h2>Datos del turno</h2>
                        <p>Elegí cómo querés tu corte</p>
                    </div>

                </div>


                <div class="datos">

                    <label for="empleado">
                        Barbero
                    </label>

                    <select name="empleado" id="empleado" required>

                        <option value="">
                            Seleccionar barbero
                        </option>

                        {% for empleado in empleados %}

                        <option value="{{ empleado.id_empleado }}">

                            {{ empleado.nombre }}

                        </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="datos">

                    <label for="servicio">
                        Servicio
                    </label>

                    <select name="servicio" id="servicio" required>

                        <option value="">
                            Seleccionar servicio
                        </option>

                        {% for servicio in servicios %}

                        <option value="{{ servicio.id_servicio }}">

                            {{ servicio.nombre }}
                            - ${{ servicio.precio }}

                        </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="datos">

                    <label for="fecha">
                        Fecha
                    </label>

                    <input type="date" name="fecha" id="fecha" required>

                </div>


                <div class="datos">

                    <label for="hora">
                        Hora
                    </label>

                    <input type="time" name="hora" id="hora" required>

                </div>

            </div>


        </form>


        <!-- =====================================
             BOTONES
        ====================================== -->

        <div class="acciones">

            <a href="{{ url_for('index') }}" class="btn-volver">

                <span>←</span>

                Volver

            </a>


            <button type="submit" form="form-reserva" class="btn-reservar">

                <span>▣</span>

                Reservar turno

            </button>

        </div>


    </div>



    <!-- =========================================
         FORMULARIO REAL PARA LOS BOTONES
    ========================================== -->

    <script>

        const formulario = document.querySelector("form");

        formulario.id = "form-reserva";

    </script>


</body>

</html>
